<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>チア校区マップ｜北摂・阪神</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --accent: #e5548a;
    --suita: #1e78d2;
    --toyonaka: #e0506e;
    --takatsuki: #2b9348;
    --ikeda: #e8871e;
    --ibaraki: #8b5cf6;
    --shimamoto: #8d6e52;
    --minoh: #66a80f;
    --settsu: #099268;
    --hirakata: #d9480f;
    --higashiyodogawa: #495057;
    --amagasaki: #1098ad;
    --nishinomiya: #364fc7;
    --itami: #9c36b5;
    --takarazuka: #a61e4d;
    --kawanishi: #1864ab;
    --addr: #8046c8;
    --venue: #0b7285;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; }
  #map { position: absolute; inset: 0; }

  /* 検索バー */
  .searchbox {
    position: absolute; z-index: 1000;
    top: 12px; left: 50%; transform: translateX(-50%);
    width: min(440px, calc(100% - 24px));
  }
  .searchbox input {
    width: 100%; padding: 12px 42px 12px 16px;
    border: none; border-radius: 24px;
    font-size: 16px; outline: none;
    background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.25);
  }
  .searchbox input:focus { box-shadow: 0 2px 12px rgba(229,84,138,.5); }
  .searchbox .clear-btn {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 30px; height: 30px; border: none; border-radius: 50%;
    background: #eee; color: #666; font-size: 15px; cursor: pointer; display: none;
  }
  .results {
    margin-top: 6px; background: #fff; border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,.25);
    max-height: 45vh; overflow-y: auto; display: none;
  }
  .results .item {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 10px 14px; cursor: pointer; border-bottom: 1px solid #f2f2f2;
  }
  .results .item:last-child { border-bottom: none; }
  .results .item:hover, .results .item.active { background: #fdeef4; }
  .results .nm { font-size: 14px; font-weight: 600; }
  .results .sub { font-size: 11px; color: #888; }
  .results .cnt { font-size: 13px; color: var(--accent); font-weight: 700; white-space: nowrap; }
  .results .none { padding: 12px 14px; font-size: 13px; color: #888; }
  .results .item.addr-search .nm, .results .item.addr-item .nm { color: var(--addr); }
  .results .item.addr-search:hover, .results .item.addr-item:hover { background: #f3ecfb; }

  /* 市バッジ */
  .badge { display: inline-block; font-size: 10px; font-weight: 700; color: #fff;
    border-radius: 8px; padding: 1px 7px; margin-right: 6px; vertical-align: 1px; }
  .badge.suita { background: var(--suita); }
  .badge.toyonaka { background: var(--toyonaka); }
  .badge.takatsuki { background: var(--takatsuki); }
  .badge.ikeda { background: var(--ikeda); }
  .badge.ibaraki { background: var(--ibaraki); }
  .badge.shimamoto { background: var(--shimamoto); }
  .badge.minoh { background: var(--minoh); }
  .badge.settsu { background: var(--settsu); }
  .badge.hirakata { background: var(--hirakata); }
  .badge.higashiyodogawa { background: var(--higashiyodogawa); }
  .badge.amagasaki { background: var(--amagasaki); }
  .badge.nishinomiya { background: var(--nishinomiya); }
  .badge.itami { background: var(--itami); }
  .badge.takarazuka { background: var(--takarazuka); }
  .badge.kawanishi { background: var(--kawanishi); }
  .badge.venue { background: var(--venue); }

  /* ピン */
  .pin { position: relative; }
  .pin .dot {
    width: 100%; height: 100%; border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg); border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.4);
  }
  .pin.suita .dot { background: var(--suita); }
  .pin.toyonaka .dot { background: var(--toyonaka); }
  .pin.takatsuki .dot { background: var(--takatsuki); }
  .pin.ikeda .dot { background: var(--ikeda); }
  .pin.ibaraki .dot { background: var(--ibaraki); }
  .pin.shimamoto .dot { background: var(--shimamoto); }
  .pin.minoh .dot { background: var(--minoh); }
  .pin.settsu .dot { background: var(--settsu); }
  .pin.hirakata .dot { background: var(--hirakata); }
  .pin.higashiyodogawa .dot { background: var(--higashiyodogawa); }
  .pin.amagasaki .dot { background: var(--amagasaki); }
  .pin.nishinomiya .dot { background: var(--nishinomiya); }
  .pin.itami .dot { background: var(--itami); }
  .pin.takarazuka .dot { background: var(--takarazuka); }
  .pin.kawanishi .dot { background: var(--kawanishi); }
  .pin.selected .dot { background: var(--accent); outline: 3px solid rgba(229,84,138,.35); }
  .pin.addr .dot { background: var(--addr); outline: 3px solid rgba(128,70,200,.3); }
  .pin.priv .dot { background: #455a64; }
  .badge.priv { background: #455a64; }

  /* 会場ピン（ひし形） */
  .vpin { width: 22px; height: 22px; transform: rotate(45deg);
    background: var(--venue); border: 2px solid #fff; border-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,.45); }
  .vpin.a0 { background: #9db3ba; }
  .vpin.selected { background: var(--accent); outline: 3px solid rgba(229,84,138,.35); }

  /* 会場ポップアップの表 */
  .pp-vtable { border-collapse: collapse; margin: 6px 0 2px; font-size: 12px; }
  .pp-vtable th { font-weight: 600; color: #999; font-size: 10px; padding: 2px 6px; text-align: right; }
  .pp-vtable th:first-child { text-align: left; }
  .pp-vtable td { padding: 2px 6px; text-align: right; font-variant-numeric: tabular-nums; border-top: 1px solid #f0f0f0; }
  .pp-vtable td:first-child { text-align: left; font-weight: 700; }
  .pp-vtable.kids { font-size: 13px; }
  .pp-vtable.kids td.tot { font-weight: 800; color: var(--accent); }
  .pp-badges { margin: 4px 0; }
  .pp-abadge { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 6px;
    padding: 1px 8px; margin-right: 4px; background: #e1f3e9; color: #17754a; }
  .pp-abadge.b { background: #ecebf6; color: #585590; }
  .pp-warn { font-size: 11px; color: #a33b00; background: #fdeee3; border-radius: 6px; padding: 4px 8px; margin: 5px 0; }
  .pp-kchips { margin: 3px 0 0; line-height: 1.9; }
  .pp-kchips .kc { display: inline-block; background: #f4f4f6; border: 1px solid #e3e3e8;
    border-radius: 10px; padding: 0 8px; font-size: 11px; margin-right: 3px; color: #555; }
  .pp-kchips .kc.home { background: #fdeef4; border-color: var(--accent); color: #a11d59; font-weight: 700; }
  .pp-kchips .rlbl { font-size: 10px; color: #aaa; margin-right: 2px; }
  .pp-syslink { display: inline-block; margin-top: 6px; font-size: 12px; color: var(--venue);
    border: 1px solid #cfe0e4; border-radius: 12px; padding: 2px 10px; text-decoration: none; }

  /* 園の凡例 */
  .ps-legend { position: absolute; z-index: 1000; bottom: 26px; left: 150px;
    background: #fff; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.3);
    padding: 7px 12px; font-size: 11px; line-height: 1.8; display: none; }
  .ps-legend .sw { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    margin-right: 4px; vertical-align: -1px; border: 1px solid #fff; box-shadow: 0 0 2px rgba(0,0,0,.4); }

  /* ポップアップ */
  .leaflet-popup-content { margin: 14px 18px; line-height: 1.5; }
  .pp-name { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
  .pp-students { font-size: 13px; margin: 4px 0; }
  .pp-students b { font-size: 22px; color: var(--accent); }
  .pp-note { font-size: 10.5px; color: #999; }

  /* 円ラベル */
  .ring-label { background: #fff; border: 1.5px solid #111; box-shadow: 0 1px 3px rgba(0,0,0,.4);
    color: #111; font-size: 13px; font-weight: 700; padding: 1px 7px; border-radius: 8px; }
  .ring-label::before { display: none; }

  /* ランキング */
  .rank-btn {
    position: absolute; z-index: 1000; bottom: 26px; left: 12px;
    border: none; border-radius: 22px; padding: 11px 18px;
    background: #fff; color: #333; font-size: 14px; font-weight: 700;
    box-shadow: 0 2px 10px rgba(0,0,0,.3); cursor: pointer;
  }
  .rank-btn:hover { background: #fdeef4; }
  .rank-panel {
    position: absolute; z-index: 1200; top: 0; right: 0; bottom: 0;
    width: min(420px, 100%); background: #fff;
    box-shadow: -2px 0 16px rgba(0,0,0,.3);
    display: none; flex-direction: column;
  }
  .rank-panel.open { display: flex; }
  .rank-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 8px;
  }
  .rank-head h2 { margin: 0; font-size: 16px; }
  .rank-close {
    width: 34px; height: 34px; border: none; border-radius: 50%;
    background: #eee; color: #555; font-size: 16px; cursor: pointer;
  }
  .rank-tabs { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 6px; padding: 0 16px 10px;
    -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
  .rank-tabs button {
    flex: 0 0 auto; padding: 7px 12px; border: 1.5px solid #ddd; border-radius: 18px;
    background: #fff; color: #555; font-size: 12.5px; font-weight: 700; cursor: pointer;
  }
  .rank-tabs button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .rank-list { flex: 1; overflow-y: auto; border-top: 1px solid #eee; }
  .rank-row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 16px; border-bottom: 1px solid #f2f2f2; cursor: pointer;
  }
  .rank-row:hover { background: #fdeef4; }
  .rank-no {
    width: 34px; text-align: right; font-size: 15px; font-weight: 800; color: #888;
    flex-shrink: 0;
  }
  .rank-row.top3 .rank-no { font-size: 18px; color: #111; }
  .rank-nm { flex: 1; min-width: 0; }
  .rank-nm .nm { font-size: 14px; font-weight: 600; }
  .rank-nm .sub { font-size: 11px; color: #999; }
  .rank-st { font-size: 16px; font-weight: 800; color: var(--accent); white-space: nowrap; }
  .rank-st small { font-size: 11px; color: #999; font-weight: 400; }
  .rank-note { padding: 8px 16px; font-size: 10.5px; color: #999; border-top: 1px solid #eee; }

  /* 出典 */
  .leaflet-control-attribution { font-size: 9px; }
</style>
</head>
<body>
<div id="map"></div>
<div class="searchbox">
  <form id="searchForm" action="." onsubmit="return false">
    <input id="q" type="search" placeholder="小学校・会場名で検索（例：やまだ／クロスパル）" autocomplete="off" enterkeyhint="search">
  </form>
  <button id="clearBtn" class="clear-btn" title="クリア">✕</button>
  <div id="results" class="results"></div>
</div>

<button id="rankBtn" class="rank-btn">📋 人数ランキング</button>
<div id="rankPanel" class="rank-panel">
  <div class="rank-head">
    <h2>児童数ランキング</h2>
    <button id="rankClose" class="rank-close" title="閉じる">✕</button>
  </div>
  <div class="rank-tabs" id="rankTabs"></div>
  <div id="rankList" class="rank-list"></div>
  <div id="rankNote" class="rank-note"></div>
</div>

<div id="psLegend" class="ps-legend">
  <span class="sw" style="background:#12b886"></span>保育園
  <span class="sw" style="background:#f59f00"></span>幼稚園<br>
  <span class="sw" style="background:#7048e8"></span>認定こども園
  <span class="sw" style="background:#868e96"></span>小規模保育
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data/schools.js"></script>
<script src="data/venues.js"></script>
<script src="data/preschools.js"></script>
<script src="data/private_schools.js"></script>
<script>
(function () {
  const DATA = window.SCHOOL_DATA;
  const SCHOOLS = DATA.schools;
  const VENUES = window.VENUE_DATA.venues;
  const PRESCHOOLS = window.PRESCHOOL_DATA.items;
  const PRIVATES = (window.PRIVATE_ELEM || { items: [] }).items;
  const CITY_CLS = { '吹田市': 'suita', '豊中市': 'toyonaka', '高槻市': 'takatsuki',
    '池田市': 'ikeda', '茨木市': 'ibaraki', '島本町': 'shimamoto',
    '箕面市': 'minoh', '摂津市': 'settsu', '枚方市': 'hirakata',
    '大阪市東淀川区': 'higashiyodogawa',
    '尼崎市': 'amagasaki', '西宮市': 'nishinomiya', '伊丹市': 'itami',
    '宝塚市': 'takarazuka', '川西市': 'kawanishi' };
  const CITY_ORDER = ['吹田市', '豊中市', '高槻市', '茨木市', '池田市', '島本町',
    '箕面市', '摂津市', '枚方市', '大阪市東淀川区',
    '尼崎市', '西宮市', '伊丹市', '宝塚市', '川西市'];
  const ASOF = {};
  Object.entries(DATA.meta.students || { '吹田市': DATA.meta.suita, '豊中市': DATA.meta.toyonaka })
    .forEach(([c, m]) => { ASOF[c] = m.asOf; });

  const map = L.map('map', { zoomControl: false });
  window._map = map;
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  const baseOsm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);
  const basePhoto = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg', {
    maxZoom: 18,
    attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html">地理院タイル</a>（全国最新写真）'
  });
  // 会場・園レイヤー（マーカー生成は後方の buildVenueLayer / buildPsLayer。関数宣言は巻き上げで利用可）
  const venueLayer = L.layerGroup();
  const psLayer = L.layerGroup();
  L.control.layers({ '地図': baseOsm, '航空写真': basePhoto },
    { 'レッスン会場': venueLayer, '保育園・幼稚園・こども園': psLayer },
    { position: 'topright', collapsed: false }).addTo(map);
  map.attributionControl.addAttribution(
    '校区・学校位置: <a href="https://nlftp.mlit.go.jp/ksj/">国土数値情報</a>（A27・P29）を加工｜児童数: 各市区町の公式資料｜園: ここdeサーチ等｜会場: 各市予約システム');
  const psLegend = document.getElementById('psLegend');
  map.on('overlayadd', e => { if (e.layer === psLayer) psLegend.style.display = 'block'; });
  map.on('overlayremove', e => { if (e.layer === psLayer) psLegend.style.display = 'none'; });

  // 全校が入る範囲で初期表示
  const allBounds = L.latLngBounds(SCHOOLS.map(s => [s.point[1], s.point[0]]));
  map.setView([34.78, 135.49], 12);
  // 環境によってはコンテナのサイズ確定がloadより後になるため、サイズ確定を監視して初回フィットする
  let fitted = false;
  new ResizeObserver(() => {
    map.invalidateSize();
    if (!fitted && map.getSize().x > 0) {
      fitted = true;
      map.fitBounds(allBounds.pad(0.05));
    }
  }).observe(document.getElementById('map'));

  // 選択時のオーバーレイ（学校用と住所ピン用は独立。重ねて比較できる）
  const overlay = L.layerGroup().addTo(map);
  const addrOverlay = L.layerGroup().addTo(map);
  let selectedMarker = null;
  let addrMarker = null;

  function makeIcon(s, selected) {
    const cls = 'pin ' + CITY_CLS[s.city] + (selected ? ' selected' : '');
    return L.divIcon({
      className: '',
      html: '<div class="' + cls + '" style="width:26px;height:26px"><div class="dot"></div></div>',
      iconSize: [26, 26], iconAnchor: [13, 24], popupAnchor: [0, -24]
    });
  }

  const markers = SCHOOLS.map(s => {
    const m = L.marker([s.point[1], s.point[0]], { icon: makeIcon(s, false), title: s.short });
    m.bindPopup(popupHtml(s), { maxWidth: 280 });
    m.on('click', () => {
      if (selectedMarker === m) deselectSchool();
      else select(s, m, false);
    });
    m.addTo(map);
    s._marker = m;
    return m;
  });

  // 私立・国立小（校区なし）: 濃グレーのピン
  PRIVATES.forEach(s => {
    const icon = L.divIcon({
      className: '',
      html: '<div class="pin priv" style="width:24px;height:24px"><div class="dot"></div></div>',
      iconSize: [24, 24], iconAnchor: [12, 22], popupAnchor: [0, -22]
    });
    const m = L.marker([s.lat, s.lon], { icon: icon, title: s.name });
    m.bindPopup('<div class="pp-name"><span class="badge priv">' + s.kind + '</span>' + s.name + '</div>' +
      '<div class="pp-students">児童数 ' + (s.students != null ? '<b>' + s.students.toLocaleString() + '</b> 人' : '未公表') + '</div>' +
      '<div class="pp-note">' + (s.asOf ? s.asOf + '｜' : '') + s.city + '（' + s.kind + '＝校区なし・通学圏は広域）</div>',
      { maxWidth: 280 });
    m.addTo(map);
  });

  function popupHtml(s) {
    const cls = CITY_CLS[s.city];
    const st = s.students != null
      ? '児童数 <b>' + s.students.toLocaleString() + '</b> 人'
      : '児童数 未調査';
    return '<div class="pp-name"><span class="badge ' + cls + '">' + s.city + '</span>' + s.short + '</div>' +
      '<div class="pp-students">' + st + '</div>' +
      '<div class="pp-note">' + (ASOF[s.city] ? ASOF[s.city] + '｜' : '') + s.address +
      '<br>円は学校から 500m / 1km / 1.5km（もう一度タップで非表示）' +
      (s.polygon ? '' : '<br>※この学校は校区の形が公式未公開のため円のみ表示') + '</div>';
  }

  function select(s, marker, fly) {
    overlay.clearLayers();
    if (selectedMarker) selectedMarker.setIcon(makeIcon(selectedMarker._school, false));
    marker._school = s;
    marker.setIcon(makeIcon(s, true));
    selectedMarker = marker;

    // 校区ポリゴン: 白フチ＋黒線＋黄色の薄塗り（地図でも航空写真でも見えるよう明度差で描く）
    // 大阪市（東淀川区）と枚方・禁野小は校区の公式データが無いため polygon=null（円のみ）
    let poly = null;
    if (s.polygon) {
      const gj = { type: 'Feature', geometry: s.polygon };
      L.geoJSON(gj, { style: { color: '#ffffff', weight: 8, fill: false, opacity: 0.9 } }).addTo(overlay);
      poly = L.geoJSON(gj, {
        style: { color: '#111111', weight: 2.5, fillColor: '#ffe600', fillOpacity: 0.22 }
      }).addTo(overlay);
    }

    // 同心円 500m / 1000m / 1500m
    const center = [s.point[1], s.point[0]];
    [[500, '500m'], [1000, '1km'], [1500, '1.5km']].forEach(([r, label]) => {
      L.circle(center, {
        radius: r, color: '#ffffff', weight: 5, opacity: 0.9,
        fill: false, interactive: false
      }).addTo(overlay);
      L.circle(center, {
        radius: r, color: '#111111', weight: 2, dashArray: '7 7',
        fill: false, interactive: false
      }).addTo(overlay);
      L.tooltip({ permanent: true, direction: 'top', className: 'ring-label', offset: [0, 0] })
        .setLatLng([center[0] + r / 111320, center[1]])
        .setContent(label)
        .addTo(overlay);
    });

    if (fly) {
      let b = L.latLng(center).toBounds(3000);
      if (poly) b = poly.getBounds().extend(b);
      map.once('moveend', () => marker.openPopup());
      map.flyToBounds(b.pad(0.05), { duration: 0.7 });
    }
  }

  function deselectSchool() {
    overlay.clearLayers();
    if (selectedMarker) {
      selectedMarker.setIcon(makeIcon(selectedMarker._school, false));
      selectedMarker.closePopup();
      selectedMarker = null;
    }
  }

  // ---- 住所ピン（施設からの逆算用）: 任意地点＋半径1.5km円 ----
  function clearAddr() {
    addrOverlay.clearLayers();
    addrMarker = null;
  }

  function showAddr(lat, lon, title) {
    clearAddr();
    const icon = L.divIcon({
      className: '',
      html: '<div class="pin addr" style="width:28px;height:28px"><div class="dot"></div></div>',
      iconSize: [28, 28], iconAnchor: [14, 26], popupAnchor: [0, -26]
    });
    addrMarker = L.marker([lat, lon], { icon: icon, title: title });
    addrMarker.bindPopup(
      '<div class="pp-name">📍 ' + title + '</div>' +
      '<div class="pp-note">この地点から半径1.5km（ピンをもう一度タップで非表示）</div>',
      { maxWidth: 280 });
    addrMarker.on('click', () => clearAddr());
    addrMarker.addTo(addrOverlay);

    const ring = L.circle([lat, lon], {
      radius: 1500, color: '#ffffff', weight: 5, opacity: 0.9,
      fill: false, interactive: false
    }).addTo(addrOverlay);
    L.circle([lat, lon], {
      radius: 1500, color: '#8046c8', weight: 2.5, dashArray: '7 7',
      fillColor: '#8046c8', fillOpacity: 0.07, interactive: false
    }).addTo(addrOverlay);
    L.tooltip({ permanent: true, direction: 'top', className: 'ring-label', offset: [0, 0] })
      .setLatLng([lat + 1500 / 111320, lon])
      .setContent('1.5km')
      .addTo(addrOverlay);

    map.once('moveend', () => addrMarker && addrMarker.openPopup());
    map.flyToBounds(ring.getBounds().pad(0.08), { duration: 0.7 });
  }

  // ---- レッスン会場レイヤー ----
  // 会場タップ → 500m/1km/1.5kmの同心円＋円内の小学校・園の数＋被っている小学校区
  const venueOverlay = L.layerGroup().addTo(map);
  let selectedVenue = null;   // {v, marker}

  // 校区の外接矩形を前計算（距離判定の足切り用）
  SCHOOLS.forEach(s => {
    if (!s.polygon) { s._bbox = null; return; }
    let x0 = 999, y0 = 999, x1 = -999, y1 = -999;
    s.polygon.coordinates.forEach(poly => poly[0].forEach(c => {
      if (c[0] < x0) x0 = c[0]; if (c[0] > x1) x1 = c[0];
      if (c[1] < y0) y0 = c[1]; if (c[1] > y1) y1 = c[1];
    }));
    s._bbox = [x0, y0, x1, y1];
  });

  const R_EARTH = 6371000;
  function havM(lat1, lon1, lat2, lon2) {
    const p1 = lat1 * Math.PI / 180, p2 = lat2 * Math.PI / 180;
    const dp = (lat2 - lat1) * Math.PI / 180, dl = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
    return 2 * R_EARTH * Math.asin(Math.sqrt(a));
  }
  // 点(lat,lon)から校区ポリゴンまでの距離[m]（内部なら0）。局所平面近似
  function distToDistrict(lat, lon, s) {
    if (!s._bbox) return Infinity;   // 校区ポリゴン非公開の学校
    const kx = 111320 * Math.cos(lat * Math.PI / 180), ky = 110540;
    const b = s._bbox;
    const dx = Math.max(b[0] - lon, 0, lon - b[2]) * kx;
    const dy = Math.max(b[1] - lat, 0, lat - b[3]) * ky;
    if (Math.hypot(dx, dy) > 1600) return Infinity;   // 足切り（1.5km判定に十分）
    let best = Infinity, inside = false;
    s.polygon.coordinates.forEach(poly => {
      const ring = poly[0];
      let inR = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
        if ((yi > lat) !== (yj > lat) && lon < (xj - xi) * (lat - yi) / (yj - yi) + xi) inR = !inR;
        // 辺までの距離
        const ax = (xi - lon) * kx, ay = (yi - lat) * ky;
        const bx = (xj - lon) * kx, by = (yj - lat) * ky;
        const ex = bx - ax, ey = by - ay;
        const L2 = ex * ex + ey * ey;
        const t = L2 ? Math.max(0, Math.min(1, -(ax * ex + ay * ey) / L2)) : 0;
        const d = Math.hypot(ax + t * ex, ay + t * ey);
        if (d < best) best = d;
      }
      if (inR) inside = true;
    });
    return inside ? 0 : best;
  }

  const RADII = [[500, '500m'], [1000, '1km'], [1500, '1.5km']];
  const PS_TYPES = ['保育園', '幼稚園', '認定こども園', '小規模保育'];

  function venueStats(v) {
    const counts = RADII.map(() => ({ '小学校': 0, '保育園': 0, '幼稚園': 0, '認定こども園': 0, '小規模保育': 0 }));
    // kids: pub=公立小児童 priv=私立小児童 en=園児(保・こ・幼、在籍優先→定員) enUnk=人数不明園
    //       c3=うち3歳以上判明分 sho=小規模保育(0-2歳・別掲) shoUnk=同不明
    const kids = RADII.map(() => ({ pub: 0, priv: 0, en: 0, enUnk: 0, c3: 0, sho: 0, shoUnk: 0 }));
    SCHOOLS.forEach(s => {
      const d = havM(v.lat, v.lon, s.point[1], s.point[0]);
      RADII.forEach(([r], i) => { if (d <= r) { counts[i]['小学校']++; kids[i].pub += (s.students || 0); } });
    });
    PRIVATES.forEach(s => {
      const d = havM(v.lat, v.lon, s.lat, s.lon);
      RADII.forEach(([r], i) => { if (d <= r) { counts[i]['小学校']++; kids[i].priv += (s.students || 0); } });
    });
    PRESCHOOLS.forEach(p => {
      const d = havM(v.lat, v.lon, p.lat, p.lon);
      const n = (p.enr != null ? p.enr : (p.cap != null ? p.cap : null));
      RADII.forEach(([r], i) => {
        if (d > r) return;
        if (p.t in counts[i]) counts[i][p.t]++;
        const k = kids[i];
        if (p.t === '小規模保育') {
          if (n != null) k.sho += n; else k.shoUnk++;
        } else {
          if (n != null) k.en += n; else k.enUnk++;
          if (p.c3 != null) k.c3 += p.c3;
        }
      });
    });
    const dists = RADII.map(() => []);   // 各半径と重なる校区
    let home = null;
    SCHOOLS.forEach(s => {
      const d = distToDistrict(v.lat, v.lon, s);
      if (d === 0 && !home) home = s;
      RADII.forEach(([r], i) => { if (d <= r) dists[i].push(s); });
    });
    return { counts, kids, dists, home };
  }

  function venuePopupHtml(v, st) {
    const cls = CITY_CLS[v.city];
    let h = '<div class="pp-name"><span class="badge ' + cls + '">' + v.city + '</span>' + esc(v.name) + '</div>' +
      '<div class="pp-badges"><span class="pp-abadge">空き枠A ' + v.a + '</span>' +
      '<span class="pp-abadge b">B ' + v.b + '</span></div>';
    if (v.warn) h += '<div class="pp-warn">⚠ ' + esc(v.warn) + '</div>';
    const F = n => n.toLocaleString();
    // ---- 人数（主役）----
    h += '<div style="font-size:11px;color:#999;margin-top:4px;font-weight:600">円内の子どもの数（人）</div>';
    h += '<table class="pp-vtable kids"><tr><th></th><th>小学生</th><th>園児</th><th>計</th></tr>';
    RADII.forEach(([r, lbl], i) => {
      const k = st.kids[i];
      const elem = k.pub + k.priv, en = k.en;
      h += '<tr><td>' + lbl + '</td><td>' + F(elem) + '</td><td>' + F(en) +
        '</td><td class="tot">' + F(elem + en) + '</td></tr>';
    });
    h += '</table>';
    const k15 = st.kids[2];
    const notes = [];
    if (k15.priv) notes.push('小学生に私立' + F(k15.priv) + '人含む');
    if (k15.c3) notes.push('園児のうち3歳以上判明分' + F(k15.c3) + '人');
    if (k15.sho || k15.shoUnk) notes.push('小規模保育(0-2歳)は別掲' + F(k15.sho) + '人' + (k15.shoUnk ? '＋不明' + k15.shoUnk + '園' : ''));
    if (k15.enUnk) notes.push('人数不明の園' + k15.enUnk + '園は園児数に未算入');
    if (notes.length) h += '<div style="font-size:10px;color:#999;margin:1px 0 2px">※1.5km時点: ' + notes.join('／') + '</div>';
    // ---- 施設数（従） ----
    h += '<div style="font-size:11px;color:#999;margin-top:5px;font-weight:600">施設数</div>';
    h += '<table class="pp-vtable"><tr><th></th><th>小学校</th><th>保育園</th><th>幼稚園</th><th>こども園</th><th>小規模</th></tr>';
    RADII.forEach(([r, lbl], i) => {
      const c = st.counts[i];
      h += '<tr><td>' + lbl + '</td><td>' + c['小学校'] + '</td><td>' + c['保育園'] + '</td><td>' +
        c['幼稚園'] + '</td><td>' + c['認定こども園'] + '</td><td>' + c['小規模保育'] + '</td></tr>';
    });
    h += '</table>';
    h += '<div class="pp-kchips">';
    if (st.home) h += '<span class="kc home">所在: ' + st.home.short + '</span> ';
    const seen = new Set(st.home ? [st.home.name] : []);
    RADII.forEach(([r, lbl], i) => {
      const add = st.dists[i].filter(s => !seen.has(s.name));
      add.forEach(s => seen.add(s.name));
      if (add.length) h += '<br><span class="rlbl">' + lbl + '内:</span>' +
        add.map(s => '<span class="kc">' + s.short.replace(/小学校$/, '') + '</span>').join('');
    });
    h += '</div>';
    h += '<a class="pp-syslink" href="' + v.sysUrl + '" target="_blank" rel="noopener">' + esc(v.sysName) + ' ↗</a>';
    h += '<div class="pp-note" style="margin-top:5px">' + esc(v.addr) + '<br>A=' + esc(window.VENUE_DATA.asOf) +
      '（平日16-18時を含む4週連続の空き枠数）。人数・校区は直線距離ベース。園児は在籍数優先・未公表は定員。もう一度タップで円を非表示</div>';
    return h;
  }

  function makeVIcon(v, selected) {
    return L.divIcon({
      className: '',
      html: '<div class="vpin' + (v.a === 0 ? ' a0' : '') + (selected ? ' selected' : '') + '"></div>',
      iconSize: [22, 22], iconAnchor: [11, 11], popupAnchor: [0, -13]
    });
  }

  function deselectVenue() {
    venueOverlay.clearLayers();
    if (selectedVenue) {
      selectedVenue.marker.setIcon(makeVIcon(selectedVenue.v, false));
      selectedVenue.marker.closePopup();
      selectedVenue = null;
    }
  }

  function selectVenue(v, marker, fly) {
    deselectVenue();
    marker.setIcon(makeVIcon(v, true));
    selectedVenue = { v, marker };
    const center = [v.lat, v.lon];
    RADII.forEach(([r, label]) => {
      L.circle(center, { radius: r, color: '#ffffff', weight: 5, opacity: 0.9, fill: false, interactive: false }).addTo(venueOverlay);
      L.circle(center, { radius: r, color: '#0b7285', weight: 2, dashArray: '7 7', fill: false, interactive: false }).addTo(venueOverlay);
      L.tooltip({ permanent: true, direction: 'top', className: 'ring-label', offset: [0, 0] })
        .setLatLng([v.lat + r / 111320, v.lon]).setContent(label).addTo(venueOverlay);
    });
    const st = venueStats(v);
    // 被っている校区（1.5km）を薄く重ねる
    st.dists[2].forEach(s => {
      L.geoJSON({ type: 'Feature', geometry: s.polygon },
        { style: { color: '#0b7285', weight: 1.5, dashArray: '3 4', fillColor: '#0b7285', fillOpacity: 0.04, interactive: false } })
        .addTo(venueOverlay);
    });
    marker.setPopupContent(venuePopupHtml(v, st));
    if (fly) {
      map.once('moveend', () => marker.openPopup());
      map.flyToBounds(L.latLng(center).toBounds(3300), { duration: 0.7 });
    } else {
      marker.openPopup();
    }
  }

  function buildVenueLayer() {
    VENUES.forEach(v => {
      const m = L.marker([v.lat, v.lon], { icon: makeVIcon(v, false), title: v.name });
      m.bindPopup('', { maxWidth: 320 });
      m.on('click', () => {
        if (selectedVenue && selectedVenue.marker === m) deselectVenue();
        else selectVenue(v, m, false);
      });
      m.addTo(venueLayer);
      v._marker = m;
    });
    venueLayer.addTo(map);   // 既定でON
  }

  function buildPsLayer() {
    const PS_COLOR = { '保育園': '#12b886', '幼稚園': '#f59f00', '認定こども園': '#7048e8', '小規模保育': '#868e96' };
    PRESCHOOLS.forEach(p => {
      const nn = (p.enr != null ? p.enr : p.cap);
      L.circleMarker([p.lat, p.lon], {
        radius: 5, color: '#fff', weight: 1.5, fillColor: PS_COLOR[p.t],
        fillOpacity: p.sus ? 0.4 : 0.95
      }).bindTooltip(p.n + '（' + p.t +
        (p.sus ? '・休止中' : (nn != null ? '・' + (p.enr != null ? '在籍' : '定員') + nn + '人' : '')) + '）'
      ).addTo(psLayer);
    });
    // 既定はOFF（レイヤーコントロールでON）
  }
  buildVenueLayer();
  buildPsLayer();

  // ---- 児童数ランキング ----
  const rankPanel = document.getElementById('rankPanel');
  const rankListEl = document.getElementById('rankList');
  const rankNoteEl = document.getElementById('rankNote');
  let rankTab = 'all';

  // タブは市区町リストから生成（児童数データがある市区町のみ）
  document.getElementById('rankTabs').innerHTML =
    '<button data-tab="all" class="active">全体</button>' +
    CITY_ORDER.filter(c => SCHOOLS.some(s => s.city === c && s.students != null))
      .map(c => '<button data-tab="' + c + '">' +
        c.replace('大阪市', '').replace(/[市町]$/, '') + '</button>').join('');

  function renderRank() {
    const rows = SCHOOLS
      .filter(s => s.students != null)   // 児童数未調査の市（高槻等）はランキング対象外
      .filter(s => rankTab === 'all' || s.city === rankTab)
      .slice().sort((a, b) => (b.students || 0) - (a.students || 0));
    rankListEl.innerHTML = rows.map((s, i) => {
      const cls = CITY_CLS[s.city];
      return '<div class="rank-row' + (i < 3 ? ' top3' : '') + '" data-name="' + s.name + '">' +
        '<div class="rank-no">' + (i + 1) + '</div>' +
        '<div class="rank-nm"><div class="nm"><span class="badge ' + cls + '">' + s.city + '</span>' + s.short + '</div>' +
        '<div class="sub">' + s.address + '</div></div>' +
        '<div class="rank-st">' + (s.students != null ? s.students.toLocaleString() : '—') + ' <small>人</small></div></div>';
    }).join('');
    rankNoteEl.textContent = rankTab === 'all'
      ? '児童数の基準日は市区町により異なります（各校のポップアップに表示）。タップすると地図でその学校を表示します。'
      : '児童数: ' + (ASOF[rankTab] || '') + '。タップすると地図でその学校を表示します。';
  }

  document.getElementById('rankBtn').addEventListener('click', () => {
    renderRank();
    rankPanel.classList.add('open');
  });
  document.getElementById('rankClose').addEventListener('click', () => rankPanel.classList.remove('open'));
  document.querySelectorAll('.rank-tabs button').forEach(btn => {
    btn.addEventListener('click', () => {
      rankTab = btn.dataset.tab;
      document.querySelectorAll('.rank-tabs button').forEach(b => b.classList.toggle('active', b === btn));
      renderRank();
    });
  });
  rankListEl.addEventListener('click', e => {
    const row = e.target.closest('.rank-row');
    if (!row) return;
    const s = SCHOOLS.find(x => x.name === row.dataset.name);
    if (!s) return;
    rankPanel.classList.remove('open');
    select(s, s._marker, true);
  });

  // ---- 検索 ----
  const input = document.getElementById('q');
  const resultsEl = document.getElementById('results');
  const clearBtn = document.getElementById('clearBtn');
  let activeIdx = -1, currentHits = [], addrHits = [], venueHits = [];

  const kata2hira = str => str.replace(/[ァ-ヶ]/g,
    ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));
  const norm = str => kata2hira(String(str || '').trim().toLowerCase());
  const esc = str => String(str).replace(/[&<>"']/g,
    ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

  function search(qRaw) {
    const q = norm(qRaw);
    if (!q) return [];
    return SCHOOLS.filter(s =>
      s.name.includes(qRaw.trim()) || s.short.includes(qRaw.trim()) ||
      norm(s.yomi).includes(q)
    );
  }

  function searchVenues(qRaw) {
    const q = qRaw.trim();
    if (!q) return [];
    return VENUES.filter(v => v.name.includes(q) || (v.addr && v.addr.includes(q)));
  }

  function venueRow(v, i) {
    return '<div class="item venue-item" data-v="' + i + '">' +
      '<div><div class="nm"><span class="badge venue">会場</span>' + esc(v.name) + '</div>' +
      '<div class="sub">' + v.city + (v.addr ? '｜' + esc(v.addr) : '') + '</div></div>' +
      '<div class="cnt">' + (v.a > 0 ? 'A' + v.a : '') + '</div></div>';
  }

  // 住所として検索する行（学校ヒットの下に常に出す）
  function addrSearchRow(q) {
    if (q.trim().length < 2) return '';
    return '<div class="item addr-search">' +
      '<div><div class="nm">📍 「' + esc(q.trim()) + '」を住所から探す</div>' +
      '<div class="sub">公民館など施設の住所に半径1.5kmの円を表示</div></div>' +
      '<div class="cnt">›</div></div>';
  }

  // 入力欄そのものは絶対に再描画しない（IME変換を守る）。結果リストだけ更新する
  function renderResults() {
    const q = input.value;
    clearBtn.style.display = q ? 'block' : 'none';
    if (!q.trim()) { resultsEl.style.display = 'none'; resultsEl.innerHTML = ''; currentHits = []; addrHits = []; venueHits = []; return; }
    currentHits = search(q);
    venueHits = searchVenues(q);
    addrHits = [];
    activeIdx = -1;
    if (!currentHits.length && !venueHits.length) {
      resultsEl.innerHTML = '<div class="none">該当する小学校・会場がありません</div>' + addrSearchRow(q);
      resultsEl.style.display = 'block';
      return;
    }
    resultsEl.innerHTML = currentHits.map((s, i) => {
      const cls = CITY_CLS[s.city];
      return '<div class="item" data-i="' + i + '">' +
        '<div><div class="nm"><span class="badge ' + cls + '">' + s.city + '</span>' + s.short + '</div>' +
        '<div class="sub">' + (s.yomi ? s.yomi + '｜' : '') + s.address + '</div></div>' +
        '<div class="cnt">' + (s.students != null ? s.students.toLocaleString() + '人' : '') + '</div></div>';
    }).join('') + venueHits.map(venueRow).join('') + addrSearchRow(q);
    resultsEl.style.display = 'block';
  }

  // 地理院の住所検索API（APIキー不要）で候補を出す
  async function searchAddress(qRaw) {
    const q = qRaw.trim();
    if (!q) return;
    resultsEl.innerHTML = '<div class="none">住所を検索中…</div>';
    resultsEl.style.display = 'block';
    try {
      const res = await fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q=' + encodeURIComponent(q));
      const list = await res.json();
      addrHits = (Array.isArray(list) ? list : []).slice(0, 8);
      currentHits = [];
      if (!addrHits.length) {
        resultsEl.innerHTML = '<div class="none">住所が見つかりません。市名から入力してみてください（例：吹田市山田西4丁目）</div>';
        return;
      }
      resultsEl.innerHTML = addrHits.map((f, i) =>
        '<div class="item addr-item" data-a="' + i + '">' +
        '<div><div class="nm">📍 ' + esc(f.properties.title) + '</div>' +
        '<div class="sub">この地点に半径1.5kmの円を表示</div></div></div>').join('');
    } catch (e) {
      resultsEl.innerHTML = '<div class="none">住所検索に失敗しました（通信エラー）。時間をおいて再度お試しください</div>';
    }
  }

  function choose(i) {
    const s = currentHits[i];
    if (!s) return;
    resultsEl.style.display = 'none';
    input.blur();
    select(s, s._marker, true);
  }

  function chooseAddr(i) {
    const f = addrHits[i];
    if (!f) return;
    resultsEl.style.display = 'none';
    input.blur();
    showAddr(f.geometry.coordinates[1], f.geometry.coordinates[0], f.properties.title);
  }

  function chooseVenue(i) {
    const v = venueHits[i];
    if (!v) return;
    resultsEl.style.display = 'none';
    input.blur();
    if (!map.hasLayer(venueLayer)) map.addLayer(venueLayer);   // レイヤーOFF中でも表示
    selectVenue(v, v._marker, true);
  }

  document.getElementById('searchForm').addEventListener('submit', e => {
    e.preventDefault();
    if (currentHits.length) choose(activeIdx >= 0 ? activeIdx : 0);
    else if (venueHits.length) chooseVenue(0);
    else if (addrHits.length) chooseAddr(0);
    else searchAddress(input.value);
  });
  input.addEventListener('input', renderResults);
  input.addEventListener('focus', renderResults);
  input.addEventListener('keydown', e => {
    if (e.isComposing) return; // IME変換中の操作は無視
    const items = resultsEl.querySelectorAll('.item');
    const key = e.key || { 13: 'Enter', 38: 'ArrowUp', 40: 'ArrowDown', 27: 'Escape' }[e.keyCode] || '';
    if (key === 'ArrowDown' || key === 'ArrowUp') {
      e.preventDefault();
      if (!items.length) return;
      activeIdx = key === 'ArrowDown'
        ? (activeIdx + 1) % items.length
        : (activeIdx - 1 + items.length) % items.length;
      items.forEach((el, i) => el.classList.toggle('active', i === activeIdx));
      items[activeIdx].scrollIntoView({ block: 'nearest' });
    } else if (key === 'Enter') {
      e.preventDefault();
      if (currentHits.length) choose(activeIdx >= 0 ? activeIdx : 0);
      else if (venueHits.length) chooseVenue(0);
      else if (addrHits.length) chooseAddr(0);
      else searchAddress(input.value);
    } else if (key === 'Escape') {
      resultsEl.style.display = 'none';
    }
  });
  resultsEl.addEventListener('click', e => {
    const addrSearch = e.target.closest('.addr-search');
    if (addrSearch) { searchAddress(input.value); return; }
    const addrItem = e.target.closest('.addr-item');
    if (addrItem) { chooseAddr(+addrItem.dataset.a); return; }
    const venueItem = e.target.closest('.venue-item');
    if (venueItem) { chooseVenue(+venueItem.dataset.v); return; }
    const item = e.target.closest('.item');
    if (item) choose(+item.dataset.i);
  });
  clearBtn.addEventListener('click', () => {
    input.value = '';
    renderResults();
    deselectSchool();
    clearAddr();
    deselectVenue();
    map.flyToBounds(allBounds.pad(0.05), { duration: 0.7 });
  });
  map.on('click', () => { resultsEl.style.display = 'none'; });
})();
</script>
</body>
</html>
